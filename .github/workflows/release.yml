# A v* tag publishes the seed's image, so `docker compose run seed` pulls it instead of building
# it: no npm or webpack on a reader's machine, which a network that inspects HTTPS would break. It's
# signed, with provenance and an SBOM, so a reader can check what they're running.
#
# To release: set the seed's image in compose.yaml to the new version, merge that, then tag the
# merge commit v<version>. The first step refuses a tag compose.yaml doesn't name, so a commit's
# compose.yaml never names an image built from anything newer.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  seed:
    name: Publish the seed image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign signs as this workflow, with its OIDC token.
      id-token: write
    env:
      IMAGE: ghcr.io/appshellhq/appshell-self-hosted-seed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: compose.yaml names this version
        run: |
          set -euo pipefail
          want="$IMAGE:${GITHUB_REF_NAME#v}"
          named=$(docker compose --profile seed config --format json | jq -r .services.seed.image)
          if [ "$named" != "$want" ]; then
            echo "::error::compose.yaml names $named, not $want. Set it there, merge, then tag."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # On the multi-platform index too, which is where GHCR reads a package's description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=appshell self-hosted seed
            org.opencontainers.image.description=Publishes the appshell-self-hosted demo's layout, pages and acme/portal to its registry
          annotations: |
            org.opencontainers.image.title=appshell self-hosted seed
            org.opencontainers.image.description=Publishes the appshell-self-hosted demo's layout, pages and acme/portal to its registry

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: seed/Dockerfile
          # npm and webpack run once, on this runner. Each platform's own stage only copies.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
