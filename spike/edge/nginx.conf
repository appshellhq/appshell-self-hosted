map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# The registry's own policy for a page, with the frames' origins added. Its default-src 'self'
# is what a frame falls back to, so without this only the same-origin frame would load.
map $upstream_http_content_security_policy $policy_with_frames {
  default '';
  ~^(?<policy>.+)$ "$policy; frame-src 'self' http://localhost:7260 http://127.0.0.1:7260";
}

server {
  listen 80;

  # The app on the application's own origin. NiceGUI reads the prefix it was served under from
  # X-Forwarded-Prefix, and its socket needs the upgrade.
  location /frames/research/ {
    proxy_pass http://research:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Prefix /frames/research;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://registry:7150;
    proxy_set_header Host $http_host;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy $policy_with_frames always;
  }
}
