# The gateway's part, on the cluster's own APISIX: who is signed in, where each host goes, and
# what the registry would do itself if it knew of frames.
#
#   spike.local.appshell.org            the portal, and the app under it by path
#   spike-research.local.appshell.org   the app on an origin of its own, on the portal's site
#   spike-auth.local.appshell.org       this namespace's Keycloak
#
# Sign-in is the console's pattern (navaris/argocd-deployment-repo,
# components/identity-domains/appshell/console): the gateway signs the browser in as its own
# confidential client and keeps the session in an encrypted, host-only cookie, so a page holds no
# token. One client and one session secret for both hosts, and a session on each: the cookie is
# host-only, so the app's own host signs in again, silently, inside its frame.
---
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: portal-session
spec:
  ingressClassName: apisix
  plugins:
    # Identity reaches upstream from the session only, never from the browser: whatever a
    # request claims in these headers is dropped before openid-connect fills them in. And a
    # request that changes something must come from this host's own pages.
    - name: serverless-pre-function
      enable: true
      config:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              if ngx.var.scheme ~= "https" then
                core.response.set_header("Location", "https://" .. ngx.var.host .. ngx.var.request_uri)
                return core.response.exit(308)
              end
              for _, header in ipairs({ "Authorization", "X-Userinfo", "X-Appshell-Subject", "X-Access-Token", "X-ID-Token", "X-Refresh-Token" }) do
                ngx.req.clear_header(header)
              end
              local method = ngx.req.get_method()
              if method ~= "GET" and method ~= "HEAD" and method ~= "OPTIONS"
                 and ngx.req.get_headers()["Origin"] ~= "https://" .. ngx.var.host then
                return core.response.exit(403, { error_msg = "cross-origin request refused" })
              end
            end
    - name: openid-connect
      enable: true
      secretRef: spike-oidc
      config:
        bearer_only: false
        unauth_action: auth
        realm: appshell
        discovery: http://keycloak.appshell-spike.svc.cluster.local:8080/realms/appshell/.well-known/openid-configuration
        scope: openid
        use_pkce: true
        use_nonce: true
        redirect_uri: https://spike.local.appshell.org/oidc/callback
        # How the app learns who is signed in: the userinfo claims, base64, in X-Userinfo.
        set_userinfo_header: true
        set_access_token_header: false
        set_id_token_header: false
        set_refresh_token_header: false
    # After openid-connect, in the same phase: who is signed in, as one stable value. X-Userinfo
    # is JSON, and its keys come out in a different order from one gateway worker to the next,
    # so the same person's header differs between connections. Hashing on it sent a page to one
    # replica and its socket, a new connection, to the other (research.yaml).
    - name: serverless-post-function
      enable: true
      config:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local userinfo = core.request.header(ctx, "X-Userinfo")
              local claims = userinfo and core.json.decode(ngx.decode_base64(userinfo) or "")
              if claims and claims.sub then
                core.request.set_header(ctx, "X-Appshell-Subject", claims.sub)
              end
            end
---
# As portal-session, for the app's own host: only the callback differs.
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: research-session
spec:
  ingressClassName: apisix
  plugins:
