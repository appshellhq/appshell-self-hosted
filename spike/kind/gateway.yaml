---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: portal
spec:
  ingressClassName: apisix
  http:
    # The app, by path on the portal's own origin, in the portal's session.
    - name: portal-research
      priority: 20
      websocket: true
      match:
        hosts:
          - spike.local.appshell.org
        paths:
          - /frames/research
          - /frames/research/*
      backends:
        - serviceName: research
          servicePort: 80
      plugin_config_name: portal-session
      plugins:
        # The app is served at /, and told the prefix it's under so its links, assets and
        # socket come out beneath it.
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - ^/frames/research/?(.*)
              - /$1
            headers:
              set:
                X-Forwarded-Prefix: /frames/research
        # A private package's equivalent for a framed service. The registry answers for
        # acme/frame's code only to a browser holding a grant for an application that runs it,
        # so asking it for that code, with the browser's cookies, asks whether this browser was
        # served such an application. Anything else is the registry's 404.
        #
        # Possible because the app is on the portal's origin, where the grant cookie is sent.
        # The question is asked in the portal's name, Host and all: a grant counts only on the
        # host its application is served from (appshellhq/appshell-services#69). The version in
        # the address is the wart: a registry that knew of frames would answer for the package.
        - name: forward-auth
          enable: true
          config:
            uri: http://registry.appshell-spike.svc.cluster.local/p/acme/frame/0.2.0/remoteEntry.js
            request_method: GET
            request_headers:
              - Cookie
              - Host
            # The registry's first answer for a version fetches it from where it's deployed.
            # The default, three seconds, refused the first request after a start.
            timeout: 10000
    # The portal: its page, its shell and its packages' code.
    - name: portal-page
      priority: 10
      match:
        hosts:
          - spike.local.appshell.org
        paths:
          - /
          - /*
      backends:
        - serviceName: registry
          servicePort: 80
      plugin_config_name: portal-session
      plugins:
        # What the registry would do itself if a composition named a frame's origin: its page
        # policy has no frame-src, so default-src 'self' refuses a frame from anywhere else.
        #
        # The identity provider's origin too. frame-src holds a frame to it through every
        # redirect, and the app's own host signs in by sending its frame there and back.
        - name: serverless-post-function
          enable: true
          config:
            phase: header_filter
            functions:
              - |
                return function(conf, ctx)
                  local policy = ngx.header["Content-Security-Policy"]
                  if type(policy) == "string" then
                    ngx.header["Content-Security-Policy"] = policy
                      .. "; frame-src 'self' https://spike-research.local.appshell.org https://spike-auth.local.appshell.org"
                  end
                end
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: research
spec:
  ingressClassName: apisix
  http:
    - name: research
      priority: 10
      websocket: true
      match:
        hosts:
          - spike-research.local.appshell.org
        paths:
          - /
          - /*
      backends:
        - serviceName: research
          servicePort: 80
      plugin_config_name: research-session
---
# Sign-in pages and the endpoints a browser is sent to. Not /admin: the admin console stays
# inside the cluster.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: keycloak
spec:
  ingressClassName: apisix
  http:
    - name: keycloak
      priority: 10
      match:
        hosts:
          - spike-auth.local.appshell.org
        paths:
          - /realms/*
          - /resources/*
      backends:
        - serviceName: keycloak
          servicePort: 8080
