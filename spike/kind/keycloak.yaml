# Who signs in: the demo's realm, with alice and bob, on a host of its own behind the gateway.
# Its own Keycloak, so nothing is added to the cluster's.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          args: [start-dev, --import-realm]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            # Generated by up.sh, not the demo's admin/admin: the cluster's gateway listens on
            # every interface.
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: spike-secrets, key: keycloak-admin-password }
            # Tokens name this issuer. The gateway and the registry reach Keycloak inside the
            # cluster, and the dynamic back channel answers them with addresses they can reach.
            - name: KC_HOSTNAME
              value: https://spike-auth.local.appshell.org
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: 'true'
            - name: KC_HTTP_ENABLED
              value: 'true'
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: 'true'
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        # keycloak/appshell-realm.json, put here by up.sh.
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - port: 8080
---
# The gateway's own client, which the demo's realm doesn't have: confidential, with the callback
# of each host a session is held on. Its secret is the one up.sh generated for the gateway.
#
# Keycloak keeps the realm in its pod, so a restarted Keycloak has forgotten this client. up.sh
# runs the job again each time.
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-client
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-client
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kcadm
          image: quay.io/keycloak/keycloak:26.0.7
          command: [bash, -ec]
          args:
            - |
              export HOME=/tmp
              kcadm=/opt/keycloak/bin/kcadm.sh

              # The password is read from KC_CLI_PASSWORD, so it's never an argument.
              for attempt in $(seq 60); do
                $kcadm config credentials --server http://keycloak:8080 --realm master --user admin && break
                [ "$attempt" = 60 ] && { echo "Keycloak never let the admin sign in"; exit 1; }
                sleep 5
              done

              if [ -n "$($kcadm get clients -r appshell -q clientId=spike-gateway --fields id --format csv --noquotes)" ]; then
                echo "spike-gateway is already there"
                exit 0
              fi

              $kcadm create clients -r appshell -f - <<EOF
              {
                "clientId": "spike-gateway",
                "secret": "${CLIENT_SECRET}",
                "publicClient": false,
                "standardFlowEnabled": true,
                "directAccessGrantsEnabled": false,
                "serviceAccountsEnabled": false,
                "redirectUris": [
                  "https://spike.local.appshell.org/oidc/callback",
                  "https://spike-research.local.appshell.org/oidc/callback"
                ],
                "attributes": { "pkce.code.challenge.method": "S256" }
              }
              EOF
          env:
            - name: KC_CLI_PASSWORD
              valueFrom:
                secretKeyRef: { name: spike-secrets, key: keycloak-admin-password }
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: spike-oidc, key: client_secret }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
